# Start with --spring.config.location=file:docs/application-example.properties
# Required secrets are environment variables; this file contains no deployed credentials.
server.port=5922
spring.application.name=DriftingLeaves
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DL_DB_URL}
spring.datasource.username=${DL_DB_USER}
spring.datasource.password=${DL_DB_PASSWORD}
spring.data.redis.host=${DL_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${DL_REDIS_PORT:6379}
spring.data.redis.password=${DL_REDIS_PASSWORD:}
spring.data.redis.database=${DL_REDIS_DATABASE:0}
spring.mail.host=${DL_SMTP_HOST}
spring.mail.port=${DL_SMTP_PORT:587}
spring.mail.username=${DL_SMTP_USER}
spring.mail.password=${DL_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
dl.jwt.secret-key=${DL_JWT_SECRET}
dl.jwt.ttl=86400000
dl.jwt.cookie-name=dL9xK2mP5vQ8
dl.jwt.token-name=token
dl.alioss.endpoint=${DL_OSS_ENDPOINT}
dl.alioss.access-key-id=${DL_OSS_ACCESS_KEY_ID}
dl.alioss.access-key-secret=${DL_OSS_ACCESS_KEY_SECRET}
dl.alioss.bucket-name=${DL_OSS_BUCKET}
dl.email.personal=${DL_SITE_TITLE:DriftingLeaves}
dl.email.from=${DL_SMTP_USER}
dl.visitor.verify-code=${DL_GUEST_VERIFY_CODE}
dl.image.compress.enabled=true
dl.image.compress.max-size-kb=300
dl.image.compress.quality=0.8
dl.image.compress.out-put-format=webp
dl.website.title=${DL_SITE_TITLE:DriftingLeaves}
dl.website.blog=${DL_BLOG_URL}
dl.website.home=${DL_HOME_URL}
dl.website.cv=${DL_CV_URL}
dl.website.admin=${DL_ADMIN_URL}
server-monitor.deployment-mode=${DL_DEPLOYMENT_MODE:auto}
